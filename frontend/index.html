<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A hiring portal: candidates apply with a resume, HR reviews each application with an explainable fit score." />
    <title>Shortlist</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23151515'/><path d='M8 23 16 8l8 15' fill='none' stroke='%23f7f8f5' stroke-width='3.25'/></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Hanken+Grotesk:ital,wght@0,400;0,600;0,700;0,800;1,400;1,500&display=swap"
    />
    <style>
      /* Desk colours from src/index.css, inlined so the first paint before the stylesheet
         loads matches the theme instead of flashing white. */
      html { background: #e6e8e3; }
      @media (prefers-color-scheme: dark) { html:not([data-theme="light"]) { background: #0f110f; } }
      html[data-theme="dark"] { background: #0f110f; }
    </style>
    <script>
      // Apply a saved theme before first paint so the page does not flash the other one.
      try {
        const saved = localStorage.getItem("shortlist-theme");
        if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
